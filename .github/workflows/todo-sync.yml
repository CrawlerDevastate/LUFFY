name: TODO README Sync

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/todo-sync.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  APPLY_MODE: "false"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Compute constrained TODO update
        env:
          APPLY: ${{ env.APPLY_MODE }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          export BASE_SHA="$(git rev-parse FETCH_HEAD)"
          python - <<'PY'
          import collections
          import difflib
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          ROOT = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          BASE = os.environ["BASE_SHA"]
          APPLY = os.environ.get("APPLY", "false").lower() == "true"
          HEADING = "### 📝 Complete TODO List"
          ENTRY_RE = re.compile(r'^- \[ \] \*\*(?P<path>.*):(?P<line>\d+)\*\* - (?P<msg>.*)$')
          TODO_RE = re.compile(r"#\s*TODO\s*:?\s*(.*)$")

          def git(*args):
              p = subprocess.run(
                  ["git", *args], cwd=ROOT, text=True,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  encoding="utf-8", errors="replace",
              )
              if p.returncode:
                  print("git failed:", args, p.stderr)
                  raise SystemExit(1)
              return p.stdout

          def scan_text(text, path):
              result = []
              for line_no, line in enumerate(text.splitlines(), 1):
                  m = TODO_RE.search(line)
                  if not m:
                      continue
                  message = m.group(1).strip()
                  if message:
                      result.append((path, line_no, message))
              return result

          def scan_worktree():
              paths = [p for p in git("ls-files", "-z", "--", "*.py").split("\0") if p]
              entries = []
              for path in paths:
                  text = (ROOT / path).read_text(encoding="utf-8", errors="replace")
                  entries.extend(scan_text(text, path))
              return sorted(entries, key=lambda x: (x[0], x[1], x[2]))

          def scan_git_revision(revision, paths):
              entries = []
              for path in paths:
                  text = git("show", f"{revision}:{path}")
                  entries.extend(scan_text(text, path))
              return sorted(entries, key=lambda x: (x[0], x[1], x[2]))

          def parse_readme(text):
              lines = text.splitlines()
              start = next((i for i, line in enumerate(lines) if line.strip() == HEADING), None)
              if start is None:
                  raise RuntimeError("Required heading is missing")
              entries = []
              for line in lines[start + 1:]:
                  if line.startswith("## "):
                      break
                  if not line.startswith("- [ ] "):
                      continue
                  m = ENTRY_RE.match(line)
                  if not m:
                      print("Malformed entry:", repr(line))
                      raise SystemExit(1)
                  entries.append((m.group("path"), int(m.group("line")), m.group("msg")))
              return entries

          def render(entries):
              return "\n".join(f"- [ ] **{p}:{n}** - {msg}" for p, n, msg in entries)

          def replace_list(readme, entries):
              pattern = re.compile(r"(?ms)^(" + re.escape(HEADING) + r"\n)\n.*?(?=^## )")
              if not pattern.search(readme):
                  raise RuntimeError("Section body was not found")
              return pattern.sub(lambda m: m.group(1) + "\n" + render(entries) + "\n\n", readme, count=1)

          base_readme = git("show", f"{BASE}:README.md")
          baseline = parse_readme(base_readme)
          changed_paths = sorted(set(
              p for p in git("diff", "--name-only", BASE, "--", "*.py").splitlines()
              if p.endswith(".py")
          ))
          print("BASE_SHA=", BASE)
          print("CHANGED_PY_PATHS=", changed_paths)

          base_changed_scan = scan_git_revision(BASE, changed_paths)
          baseline_changed = [e for e in baseline if e[0] in set(changed_paths)]
          print("BASE_CHANGED_README_ENTRIES=", len(baseline_changed))
          print("BASE_CHANGED_SCANNED_ENTRIES=", len(base_changed_scan))
          if baseline_changed != base_changed_scan:
              print("CHANGED-FILE PARSER VALIDATION FAILED")
              print("README:")
              for e in baseline_changed:
                  print(" ", e)
              print("SCANNED:")
              for e in base_changed_scan:
                  print(" ", e)
              sys.exit(2)
          print("CHANGED-FILE PARSER VALIDATION OK")

          current_scanned = scan_worktree()
          print("ALL_CURRENT_PY_TODO_ENTRIES_SCANNED=", len(current_scanned))
          by_path = collections.defaultdict(list)
          for entry in current_scanned:
              by_path[entry[0]].append(entry)

          changed_set = set(changed_paths)
          merged = [entry for entry in baseline if entry[0] not in changed_set]
          for path in changed_paths:
              merged.extend(by_path.get(path, []))
          merged.sort(key=lambda e: (e[0], e[1]))

          old_counts = collections.Counter(p for p, _, _ in baseline)
          new_counts = collections.Counter(p for p, _, _ in merged)
          for path in changed_paths:
              print(f"COUNT {path}: {old_counts[path]} -> {new_counts[path]}")
              print("OLD:")
              for e in baseline:
                  if e[0] == path:
                      print(" ", e)
              print("NEW:")
              for e in by_path.get(path, []):
                  print(" ", e)

          readme_path = ROOT / "README.md"
          current_readme = readme_path.read_text(encoding="utf-8")
          updated = replace_list(current_readme, merged)
          if updated.count(HEADING) != 1:
              raise RuntimeError("Heading count changed")
          if parse_readme(updated) != merged:
              raise RuntimeError("Round-trip parse failed")
          print(f"TOTAL {len(baseline)} -> {len(merged)}")

          diff = list(difflib.unified_diff(
              current_readme.splitlines(), updated.splitlines(),
              fromfile="README.md before", tofile="README.md after",
              n=3, lineterm=""
          ))
          print("DIFF_BEGIN")
          print("\n".join(diff[:1200]))
          print("DIFF_END")
          print("DIFF_LINES=", len(diff))

          if APPLY:
              readme_path.write_text(updated, encoding="utf-8")
              print("APPLY_COMPLETE")
          else:
              print("DRY_RUN_COMPLETE")
          PY

      - name: Commit README
        if: env.APPLY_MODE == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "No README changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update TODO list for dev implementation"
          git push origin HEAD:dev
