name: Update TODO README

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/update-todo-readme.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  APPLY_MODE: "false"

jobs:
  update-todos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Scan TODOs and update README
        env:
          APPLY: ${{ env.APPLY_MODE }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          export BASE_SHA="$(git rev-parse FETCH_HEAD)"
          python - <<'PY'
          import collections
          import difflib
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          ROOT = Path(os.environ.get("GITHUB_WORKSPACE", ".")).resolve()
          BASE = os.environ["BASE_SHA"]
          APPLY = os.environ.get("APPLY", "false").lower() == "true"
          HEADING = "### 📝 Complete TODO List"

          ENTRY_RE = re.compile(
              r'^- \[ \] \*\*(?P<path>.*):(?P<line>\d+)\*\* - (?P<msg>.*)$'
          )
          TODO_RE = re.compile(r"#\s*TODO\s*:?\s*(.*)$")

          def git(*args):
              p = subprocess.run(
                  ["git", *args],
                  cwd=ROOT,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  encoding="utf-8",
                  errors="replace",
              )
              if p.returncode != 0:
                  print("GIT COMMAND FAILED:", args)
                  print(p.stderr)
                  raise SystemExit(1)
              return p.stdout

          def scan_text(text, path):
              entries = []
              for line_no, line in enumerate(text.splitlines(), start=1):
                  match = TODO_RE.search(line)
                  if match:
                      message = match.group(1).strip()
                      entries.append((path, line_no, message))
              return entries

          def scan_dev():
              paths = [p for p in git("ls-files", "-z", "--", "*.py").split("\0") if p]
              entries = []
              for path in paths:
                  text = (ROOT / path).read_text(encoding="utf-8", errors="replace")
                  entries.extend(scan_text(text, path))
              return sorted(entries, key=lambda e: (e[0], e[1], e[2]))

          def scan_base():
              raw = git("ls-tree", "-r", "--name-only", "-z", BASE)
              paths = [p for p in raw.split("\0") if p.endswith(".py")]
              entries = []
              for path in paths:
                  text = git("show", f"{BASE}:{path}")
                  entries.extend(scan_text(text, path))
              return sorted(entries, key=lambda e: (e[0], e[1], e[2]))

          def parse_readme(text):
              lines = text.splitlines()
              heading_index = None
              for i, line in enumerate(lines):
                  if line.strip() == HEADING:
                      heading_index = i
                      break
              if heading_index is None:
                  raise RuntimeError("Complete TODO heading was not found")

              entries = []
              for line in lines[heading_index + 1:]:
                  if line.startswith("## "):
                      break
                  if not line.startswith("- [ ] "):
                      continue
                  match = ENTRY_RE.match(line)
                  if not match:
                      print("MALFORMED README ENTRY:", repr(line))
                      raise SystemExit(1)
                  entries.append((
                      match.group("path"),
                      int(match.group("line")),
                      match.group("msg"),
                  ))
              return entries

          def render(entries):
              return "\n".join(
                  f"- [ ] **{path}:{line}** - {message}"
                  for path, line, message in entries
              )

          def replace_section(readme, entries):
              pattern = re.compile(
                  r"(?ms)^(" + re.escape(HEADING) + r"\n)\n.*?(?=^## )"
              )
              if not pattern.search(readme):
                  raise RuntimeError("TODO section body pattern was not found")
              replacement = lambda m: m.group(1) + "\n" + render(entries) + "\n\n"
              return pattern.sub(replacement, readme, count=1)

          base_readme = git("show", f"{BASE}:README.md")
          baseline_entries = parse_readme(base_readme)
          base_scanned = scan_base()

          baseline_counter = collections.Counter(baseline_entries)
          scanned_counter = collections.Counter(base_scanned)
          print(f"Baseline README entries: {len(baseline_entries)}")
          print(f"Scanned base .py TODO entries: {len(base_scanned)}")

          missing = scanned_counter - baseline_counter
          extra = baseline_counter - scanned_counter
          if missing:
              print("SCANNED BUT MISSING FROM README:")
              for entry, count in sorted(missing.items()):
                  print("  ", count, entry)
          if extra:
              print("IN README BUT NOT SCANNED:")
              for entry, count in sorted(extra.items()):
                  print("  ", count, entry)

          if baseline_entries != base_scanned:
              print("PARSER_VALIDATION_FAILED")
              for i, (old, new) in enumerate(zip(baseline_entries, base_scanned)):
                  if old != new:
                      print("FIRST ORDER MISMATCH AT", i)
                      print("README :", old)
                      print("SCANNED:", new)
                      break
              sys.exit(2)
          print("PARSER_VALIDATION_OK: scanner reproduces the baseline README list")

          dev_entries = scan_dev()
          changed_paths = set(
              p for p in git("diff", "--name-only", f"{BASE}", "HEAD", "--", "*.py").splitlines()
              if p.endswith(".py")
          )
          changed_paths.update(
              p for p in git("diff", "--name-only", "--", "*.py").splitlines()
              if p.endswith(".py")
          )
          print("CHANGED_PY_PATHS:", sorted(changed_paths))

          by_path = collections.defaultdict(list)
          for entry in dev_entries:
              by_path[entry[0]].append(entry)

          merged_entries = [
              entry for entry in baseline_entries if entry[0] not in changed_paths
          ]
          for path in sorted(changed_paths):
              merged_entries.extend(by_path.get(path, []))
          merged_entries.sort(key=lambda e: (e[0], e[1]))

          old_counts = collections.Counter(path for path, _, _ in baseline_entries)
          new_counts = collections.Counter(path for path, _, _ in merged_entries)
          print("ENTRY COUNTS BY TOUCHED/CHANGED FILE:")
          for path in sorted(old_counts.keys() | new_counts.keys()):
              if path in changed_paths or old_counts[path] != new_counts[path]:
                  print(f"  {path}: {old_counts[path]} -> {new_counts[path]}")

          for path in sorted(changed_paths):
              print(f"\nDETAIL FOR {path}")
              print("OLD README ENTRIES:")
              for entry in baseline_entries:
                  if entry[0] == path:
                      print("  ", entry)
              print("CURRENT SCANNED ENTRIES:")
              for entry in by_path.get(path, []):
                  print("  ", entry)

          current_readme = (ROOT / "README.md").read_text(encoding="utf-8")
          updated_readme = replace_section(current_readme, merged_entries)
          reparsed = parse_readme(updated_readme)
          if reparsed != merged_entries:
              print("ROUND_TRIP_VALIDATION_FAILED")
              print("Expected:", len(merged_entries), "Parsed:", len(reparsed))
              sys.exit(3)
          if updated_readme.count(HEADING) != 1:
              raise RuntimeError("Section title count changed")

          print(f"OLD_TOTAL={len(baseline_entries)} NEW_TOTAL={len(merged_entries)}")
          diff = list(difflib.unified_diff(
              current_readme.splitlines(),
              updated_readme.splitlines(),
              fromfile="README.md before",
              tofile="README.md after",
              n=3,
              lineterm="",
          ))
          print("README_DIFF_BEGIN")
          print("\n".join(diff[:2000]))
          print("README_DIFF_END")
          print(f"README_DIFF_LINES={len(diff)}")

          if APPLY:
              (ROOT / "README.md").write_text(updated_readme, encoding="utf-8")
              print("APPLY_MODE: README.md written")
          else:
              print("DRY_RUN_MODE: README.md was not written")
          PY

      - name: Commit and push README
        if: env.APPLY_MODE == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "No README.md changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update TODO list for dev implementation"
          git push origin HEAD:dev
